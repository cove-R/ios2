<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9e6f7">
<title>iPhone UI Simulator · iOS 18</title>
<style>
:root{--ink:#172033;--glass:rgba(255,255,255,.68);--line:rgba(255,255,255,.55);--blue:#087cff;--muted:#7b8494}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo",Arial,sans-serif;color:var(--ink)}
body{background:radial-gradient(ellipse at 12% 10%,#ffe4e6 0,transparent 34%),radial-gradient(ellipse at 88% 22%,#d7e7ff 0,transparent 38%),radial-gradient(ellipse at 50% 100%,#d7f0ec 0,transparent 42%),#f4f2f6;display:flex;align-items:center;justify-content:center;padding:24px 14px}
.shell{width:min(100%,440px);display:grid;gap:16px;justify-items:center}
.intro{text-align:center;max-width:420px}.intro .eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#4c6c98}.intro h1{font-size:clamp(25px,6vw,36px);margin:7px 0 5px;letter-spacing:-.04em}.intro p{margin:0;color:#68748a;font-size:14px;line-height:1.55}
.phone{width:min(100%,380px);height:min(790px,calc(100dvh - 210px));min-height:550px;position:relative;padding:9px;border-radius:54px;background:linear-gradient(145deg,#343840,#08090d 34%,#53555b 55%,#090a0e 80%);box-shadow:0 28px 70px #31425b40,0 7px 14px #1115,inset 0 0 0 2px #777a82;isolation:isolate}
.phone:before{content:"";position:absolute;inset:3px;border-radius:51px;border:1px solid #ffffff65;pointer-events:none;z-index:8}
.screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:45px;background:#e8edf6}
.wallpaper{position:absolute;inset:0;background:radial-gradient(ellipse at 15% 65%,#ffced4 0,transparent 38%),radial-gradient(ellipse at 75% 45%,#b6a9f8 0,transparent 39%),radial-gradient(ellipse at 35% 15%,#7ab5f2 0,transparent 48%),linear-gradient(145deg,#4b87d7,#c7d8f4 52%,#f5d4d8);transition:filter .3s}
.wallpaper:after{content:"";position:absolute;inset:45% -20% -15%;background:linear-gradient(150deg,#f5b9ca,#8c9cf0 55%,#7fc8d4);border-radius:50% 50% 0 0/18% 18% 0 0;transform:rotate(-12deg);opacity:.75}
.status{position:absolute;z-index:12;top:12px;left:22px;right:22px;height:22px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:750;color:#101725}.status .right{display:flex;gap:5px;align-items:center}.island{position:absolute;z-index:13;top:10px;left:50%;transform:translateX(-50%);width:94px;height:27px;background:#050608;border-radius:20px;box-shadow:inset 0 1px 1px #555}
.home-indicator{position:absolute;z-index:30;bottom:7px;left:50%;transform:translateX(-50%);width:108px;height:4px;border-radius:9px;background:#101116}
.screen-content{position:absolute;inset:0;z-index:2}
.lock-screen{height:100%;display:flex;flex-direction:column;align-items:center;color:white;padding:62px 18px 28px;text-shadow:0 1px 8px #334c6a40}
.lock-date{font-size:14px;font-weight:650;margin-top:8px}.lock-time{font-size:clamp(65px,19vw,91px);line-height:1.05;letter-spacing:-.065em;font-weight:250}
.lock-widgets{display:flex;gap:9px;margin-top:22px;width:100%}.widget{flex:1;min-height:75px;padding:12px;border:1px solid #ffffff70;background:#ffffff35;backdrop-filter:blur(18px);border-radius:19px;font-size:12px}.widget strong{display:block;font-size:17px;margin:5px 0}
.notifications{width:100%;margin-top:auto;display:grid;gap:8px}.notice{background:#ffffffd9;color:#202634;text-shadow:none;border-radius:16px;padding:11px 12px;display:flex;gap:10px;align-items:center;font-size:12px;box-shadow:0 5px 18px #24395515}.notice .appico{width:27px;height:27px;font-size:17px}.notice small{display:block;color:#7d8593;margin-top:3px}
.lock-bottom{display:flex;justify-content:space-between;width:100%;margin-top:18px}.round-tool{width:43px;height:43px;border-radius:50%;border:1px solid #ffffff70;background:#ffffff35;color:white;font-size:19px;backdrop-filter:blur(10px)}
.home-screen{height:100%;padding:59px 15px 28px;display:flex;flex-direction:column}
.weather-widget{height:105px;border-radius:23px;padding:13px 15px;color:white;background:linear-gradient(135deg,#347fcb,#82b9e7);box-shadow:0 8px 22px #3d76b12b;display:flex;justify-content:space-between;margin:5px 1px 21px}.weather-widget .temp{font-size:32px;font-weight:300;line-height:1.1}.weather-widget small{opacity:.9}.sun{font-size:36px;align-self:center}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px 7px;align-content:start}
.app{border:0;background:none;color:inherit;padding:0;display:flex;align-items:center;flex-direction:column;gap:5px;min-width:0;cursor:pointer;font:inherit}
.app-icon{width:clamp(43px,12vw,57px);height:clamp(43px,12vw,57px);border-radius:14px;display:grid;place-items:center;font-size:clamp(23px,6vw,30px);color:white;box-shadow:0 3px 7px #19233b20;position:relative;overflow:hidden}
.app-icon:after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,#ffffff45,transparent 50%);pointer-events:none}
.app-label{font-size:10px;text-shadow:0 1px 5px #ffffff90;white-space:nowrap}
.dock{margin-top:auto;border:1px solid #ffffff80;background:#ffffff65;backdrop-filter:blur(24px);border-radius:27px;padding:10px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dock .app-label{display:none}.dock .app-icon{width:clamp(43px,12vw,55px);height:clamp(43px,12vw,55px)}
.blue{background:linear-gradient(145deg,#35b8ff,#0676e8)}.green{background:linear-gradient(145deg,#6de28a,#10a650)}.red{background:linear-gradient(145deg,#ff827e,#ed303f)}.yellow{background:linear-gradient(145deg,#ffe47a,#ffad18)}.purple{background:linear-gradient(145deg,#d5a6ff,#7e42d9)}.gray{background:linear-gradient(145deg,#b9c2d0,#6e7889)}.black{background:linear-gradient(145deg,#555b67,#11131a)}.pink{background:linear-gradient(145deg,#ffb9d1,#ed548d)}
.app-view{position:absolute;inset:0;z-index:5;background:#f4f5f9;display:flex;flex-direction:column;animation:open .22s ease-out}
@keyframes open{from{transform:translateY(18px);opacity:.65}to{transform:translateY(0);opacity:1}}
.app-header{padding:54px 19px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #dce0e8;background:#f7f7f9}.app-header h2{font-size:27px;margin:0;letter-spacing:-.04em;flex:1}.back{border:0;background:#e4efff;color:#087cff;border-radius:50%;width:34px;height:34px;font-size:22px;cursor:pointer}.app-body{padding:17px;overflow:auto;flex:1;padding-bottom:35px}.muted{color:#7a8495;font-size:13px}.section-title{font-size:13px;color:#788191;margin:19px 4px 8px}.settings-card{background:white;border-radius:15px;overflow:hidden;margin-bottom:13px}.setting-row{display:flex;align-items:center;gap:12px;padding:13px 12px;border-bottom:1px solid #eff0f4;font-size:14px;min-height:49px}.setting-row:last-child{border-bottom:0}.setting-icon{width:29px;height:29px;border-radius:8px;color:white;display:grid;place-items:center;font-size:16px}.setting-row .tail{margin-left:auto;color:#8c93a0}.toggle{margin-left:auto;width:43px;height:26px;border:0;border-radius:20px;background:#cbd0d8;padding:3px;cursor:pointer;transition:.2s}.toggle:after{content:"";display:block;width:20px;height:20px;background:white;border-radius:50%;box-shadow:0 1px 3px #0002;transition:.2s}.toggle.on{background:#34c759}.toggle.on:after{transform:translateX(17px)}
.profile{display:flex;align-items:center;gap:12px;padding:14px;background:white;border-radius:16px;margin-bottom:14px}.avatar{width:49px;height:49px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffcfdb,#c6d5ff);font-size:26px}.profile strong{display:block;font-size:16px}.profile small{color:#858d9a}
.message-thread{display:flex;flex-direction:column;gap:10px}.bubble{max-width:82%;padding:10px 13px;border-radius:19px;font-size:14px;line-height:1.35;background:#e4e5e9;align-self:flex-start}.bubble.mine{background:#087cff;color:white;align-self:flex-end;border-bottom-right-radius:6px}.bubble:not(.mine){border-bottom-left-radius:6px}.compose{display:flex;gap:7px;padding:9px;background:#f7f7f9;border-top:1px solid #ddd}.compose input{flex:1;border:1px solid #d8dce4;border-radius:22px;padding:10px 13px;min-width:0;font:inherit}.send{border:0;border-radius:50%;width:40px;background:#087cff;color:white;font-size:18px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.photo{aspect-ratio:1;border:0;border-radius:5px;background:linear-gradient(135deg,#9cc4ed,#f7c6c8);font-size:27px;cursor:pointer}.photo:nth-child(3n+2){background:linear-gradient(145deg,#f4d2ad,#7b9cc5)}.photo:nth-child(3n){background:linear-gradient(145deg,#b3e1d8,#8a91c9)}
.camera{background:#090a0c;color:white;flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:15px}.camera-preview{flex:1;margin:18px 0;border-radius:10px;background:linear-gradient(160deg,#efb7a4,#f8d7ad 35%,#7188a9 36%,#263e60 70%,#111d31);display:grid;place-items:center;font-size:50px;position:relative;overflow:hidden}.camera-preview:after{content:"";position:absolute;left:-10%;right:-10%;height:1px;background:#ffffff50;top:50%;box-shadow:0 45px #ffffff20,-35px 70px #ffffff20}.shutter{width:68px;height:68px;border-radius:50%;background:white;border:5px solid #bfc3c8;box-shadow:inset 0 0 0 3px #111;cursor:pointer}.camera-controls{display:flex;align-items:center;justify-content:space-around}.cam-small{background:#292b30;color:white;border:0;border-radius:50%;width:42px;height:42px;font-size:20px}
.browserbar{display:flex;gap:7px;padding:10px;background:#f5f5f8;border-bottom:1px solid #ddd}.browserbar input{min-width:0;flex:1;border:0;background:#e5e6eb;border-radius:12px;padding:11px;font-size:13px}.browserbar button{border:0;background:none;color:#087cff;font-size:20px}.webpage{flex:1;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 20% 80%,#f8cbd7,transparent 40%),linear-gradient(#e8f2ff,#fff)}.webpage .apple{font-size:54px}.webpage h2{font-size:32px;margin:12px 0 3px}.webpage p{color:#66738a;font-size:14px}.webpage .cta{background:#087cff;color:white;border:0;padding:12px 20px;border-radius:20px;margin-top:14px}
.control-center{position:absolute;inset:0;z-index:15;padding:55px 16px 30px;background:linear-gradient(140deg,#7b91a9d9,#8d9eacd9,#c5c5d2d9);backdrop-filter:blur(32px);display:flex;flex-direction:column;gap:12px;animation:open .2s}.cc-top{display:flex;gap:10px}.cc-card{background:#ffffffb5;border-radius:22px;padding:12px;flex:1}.cc-connect{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cc-btn{border:0;border-radius:50%;width:43px;height:43px;background:#ffffffd9;font-size:19px;cursor:pointer}.cc-btn.active{background:#087cff;color:white}.cc-media{display:flex;flex-direction:column;justify-content:center;font-size:12px;gap:7px}.cc-media strong{font-size:14px}.cc-row{display:flex;gap:10px}.cc-tile{flex:1;min-height:72px;background:#ffffffb5;border-radius:19px;padding:12px;display:flex;align-items:center;gap:8px;font-size:12px}.slider-tile{flex:1;background:#ffffffb5;border-radius:22px;padding:10px 6px;display:flex;align-items:center;flex-direction:column;gap:8px}.slider-track{height:100px;width:37px;border-radius:18px;background:linear-gradient(to top,#fff 0 68%,#d8dce2 68%);position:relative}.slider-track:after{content:"";position:absolute;bottom:4px;left:4px;right:4px;height:60%;background:#fff;border-radius:14px;opacity:.5}
.toast{position:absolute;z-index:40;left:18px;right:18px;bottom:30px;background:#1f2736e8;color:white;border-radius:15px;padding:12px 15px;font-size:13px;text-align:center;animation:open .2s}
@media(max-height:720px){.phone{height:calc(100dvh - 175px);min-height:500px}.intro p{font-size:12px}.weather-widget{height:88px;margin-bottom:14px}.app-grid{gap:12px 6px}}
@media(min-width:700px){body{padding:30px}.shell{grid-template-columns: minmax(210px,1fr) 380px;align-items:center;max-width:850px}.intro{text-align:left}.intro h1{font-size:40px}.intro p{max-width:300px}.phone{height:min(790px,calc(100dvh - 60px))}}
</style>
</head>
<body>
<div class="shell">
  <header class="intro"><div class="eyebrow">A little iPhone in your browser</div><h1>iPhone UI <span style="color:#087cff">♡</span></h1><p>웹에서 만나는 iOS 18 스타일 시뮬레이터예요. 화면을 터치하고 앱을 실행해 보세요.</p></header>
  <div class="phone"><div class="screen" id="screen">
    <div class="wallpaper" id="wallpaper"></div>
    <div class="status"><span id="statusTime">9:41</span><span class="right"><span>▮▮▮</span><span>◉</span><span>▰</span></span></div><div class="island"></div>
    <div class="screen-content" id="mainContent"></div>
    <div id="overlay"></div><div class="home-indicator" id="homeIndicator"></div>
  </div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const main=$('#mainContent'),overlay=$('#overlay'),wallpaper=$('#wallpaper');
let current='lock',locked=true,previous='home',toastTimer=null,brightness=100,volume=55;
let settings={wifi:true,bluetooth:true,airplane:false,cellular:true,focus:false,appearance:false,notifications:true,sounds:true};
let messages=[{text:'지금 뭐해? ㅎㅎ',mine:false},{text:'공부하고 있어 ㅠㅠ',mine:true},{text:'헉 힘내!! 조금만 더 하면 끝날거야 오늘도 수고했어 💗',mine:false},{text:'고마워 ㅠㅠ 너무 힘난다 ㅎㅎ',mine:true}];
const apps=[
 {id:'messages',name:'메시지',emoji:'💬',color:'green'},{id:'calendar',name:'캘린더',emoji:'26',color:'white'},
 {id:'photos',name:'사진',emoji:'🌈',color:'white'},{id:'camera',name:'카메라',emoji:'📷',color:'gray'},
 {id:'mail',name:'메일',emoji:'✉️',color:'blue'},{id:'notes',name:'메모',emoji:'📝',color:'yellow'},
 {id:'reminders',name:'미리 알림',emoji:'☑️',color:'white'},{id:'clock',name:'시계',emoji:'🕒',color:'black'},
 {id:'tv',name:'TV',emoji:'tv+',color:'black'},{id:'podcasts',name:'팟캐스트',emoji:'◉',color:'purple'},
 {id:'store',name:'앱 스토어',emoji:'A',color:'blue'},{id:'maps',name:'지도',emoji:'🗺️',color:'white'},
 {id:'health',name:'건강',emoji:'♥',color:'white'},{id:'wallet',name:'지갑',emoji:'▤',color:'black'},
 {id:'settings',name:'설정',emoji:'⚙️',color:'gray'},{id:'safari',name:'Safari',emoji:'🧭',color:'white'}
];
function icon(a){let style=({white:'background:linear-gradient(145deg,#fff,#e9edf4);color:#2584ed',yellow:'background:linear-gradient(145deg,#fff0a5,#ffc52b);color:#f08b16',black:'background:linear-gradient(145deg,#424550,#11131a)',gray:'background:linear-gradient(145deg,#c4cbd5,#697486)',green:'background:linear-gradient(145deg,#65e58b,#0eaa55)',blue:'background:linear-gradient(145deg,#51c7ff,#0876e8)',red:'background:linear-gradient(145deg,#ff777d,#e6223b)',purple:'background:linear-gradient(145deg,#d7a3ff,#7540d8)'})[a.color]||'';return `<span class="app-icon" style="${style}">${a.emoji}</span>`}
function appButton(a){return `<button class="app" data-app="${a.id}" aria-label="${a.name}">${icon(a)}<span class="app-label">${a.name}</span></button>`}
function home(){current='home';main.innerHTML=`<div class="home-screen"><div class="weather-widget"><div><small>서울 · 오늘</small><div class="temp">18°</div><small>대체로 맑음</small></div><div class="sun">☀️</div></div><div class="app-grid">${apps.map(appButton).join('')}</div><div class="dock">${[apps[0],apps[15],apps[0],{id:'music',name:'음악',emoji:'♫',color:'red'}].map(appButton).join('')}</div></div>`;bindApps()}
function lock(){current='lock';main.innerHTML=`<div class="lock-screen"><div class="lock-date">10월 26일 일요일</div><div class="lock-time" id="bigTime">9:41</div><div class="lock-widgets"><div class="widget">☀️ 서울 <strong>18°</strong><span>맑음</span></div><div class="widget">일정 <strong>오늘</strong><span>나를 위한 하루 ♡</span></div></div><div class="notifications"><div class="notice"><span class="app-icon green">💬</span><div><b>메시지 · 묭이 💗</b><small>지금 뭐해? ㅎㅎ</small></div></div><div class="notice"><span class="app-icon blue">✉️</span><div><b>메일</b><small>새로운 알림이 도착했어요</small></div></div></div><div class="lock-bottom"><button class="round-tool" data-tool="flash">☼</button><button class="round-tool" data-tool="camera">📷</button></div><div style="font-size:11px;margin-top:10px;opacity:.9">위로 밀어 잠금 해제</div></div>`;bindApps()}
function bindApps(){main.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));main.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>b.dataset.tool==='camera'?openApp('camera'):notify('손전등을 켰어요 🔦')))}
function appFrame(title,body,back=true){main.innerHTML=`<div class="app-view">${back?`<div class="app-header"><button class="back" data-back>‹</button><h2>${title}</h2></div>`:''}${body}</div>`;if(back)main.querySelector('[data-back]').onclick=()=>home()}
function openApp(id){locked=false;previous=current;current=id;
if(id==='settings'){settingsApp();return}
if(id==='messages'){messagesApp();return}
if(id==='camera'){cameraApp();return}
if(id==='photos'){photosApp();return}
if(id==='safari'){safariApp();return}
if(id==='calendar'){appFrame('캘린더',`<div class="app-body"><div style="font-size:14px;color:#087cff;font-weight:700">2026년 10월</div><h1 style="font-size:42px;margin:5px 0 18px">일요일, 26일</h1><div class="settings-card">${['월요일 · 27일','화요일 · 28일','수요일 · 29일','목요일 · 30일','금요일 · 31일'].map((d,i)=>`<div class="setting-row"><b style="color:#087cff;width:35px">${27+i}</b>${d.split(' · ')[0]}<span class="tail">일정 없음</span></div>`).join('')}</div></div>`);return}
if(id==='notes'){appFrame('메모',`<div class="app-body"><p class="muted">모든 iCloud</p><textarea style="width:100%;height:250px;border:0;background:transparent;font:17px/1.6 inherit;outline:none" placeholder="새로운 메모를 작성하세요…"></textarea></div>`);return}
if(id==='clock'){appFrame('시계',`<div class="app-body" style="text-align:center;padding-top:60px"><div style="font-size:62px;font-weight:200" id="liveClock">9:41</div><p>서울 · 대한민국</p><div class="settings-card" style="text-align:left;margin-top:40px"><div class="setting-row">알람 <span class="tail">＋</span></div><div class="setting-row">스톱워치 <span class="tail">시작</span></div><div class="setting-row">타이머 <span class="tail">1:00</span></div></div></div>`);updateClock();return}
if(id==='mail'){appFrame('받은 편지함',`<div class="app-body"><p class="muted">오늘</p><div class="settings-card"><div class="setting-row">✉️　환영합니다!<span class="tail">방금</span></div><div class="setting-row">✉️　새로운 소식이 도착했어요<span class="tail">어제</span></div></div></div>`);return}
if(id==='reminders'){appFrame('미리 알림',`<div class="app-body"><div class="settings-card">${['오늘 할 일','잠깐 쉬어가기','좋아하는 음악 듣기','나에게 친절하기'].map(x=>`<label class="setting-row"><input type="checkbox"> ${x}</label>`).join('')}</div></div>`);return}
if(id==='maps'){appFrame('지도',`<div class="app-body" style="height:100%;background:linear-gradient(45deg,#d7ead9 25%,#f6e9cf 25% 45%,#d5e7f7 45% 65%,#e8e4d8 65%);display:grid;place-items:center"><div style="background:white;border-radius:18px;padding:16px;box-shadow:0 4px 20px #0002">📍 <b>현재 위치</b><p class="muted">지도 미리보기</p></div></div>`);return}
if(id==='store'){appFrame('App Store',`<div class="app-body"><h2>오늘의 앱</h2><div class="settings-card" style="padding:20px;background:linear-gradient(135deg,#c7d9ff,#e5d7ff)"><h2>새로운 하루를 시작해요</h2><p>마음에 드는 앱을 찾아보세요.</p><button class="cta" onclick="notify('앱 스토어 미리보기예요')">둘러보기</button></div></div>`);return}
if(id==='music'||id==='tv'||id==='podcasts'){appFrame(id==='music'?'음악':id==='tv'?'Apple TV':'팟캐스트',`<div class="app-body" style="text-align:center;padding-top:55px"><div style="font-size:70px">${id==='music'?'♫':id==='tv'?'tv+':'◉'}</div><h2>좋아하는 것을 발견하세요</h2><p class="muted">이 화면은 시뮬레이션입니다.</p><button class="cta" onclick="notify('재생할 콘텐츠를 준비 중이에요 🎵')">재생하기</button></div>`);return}
if(id==='health'||id==='wallet'){appFrame(id==='health'?'건강':'지갑',`<div class="app-body"><div class="profile"><div class="avatar">${id==='health'?'♥':'▤'}</div><div><strong>${id==='health'?'건강한 하루':'카드 및 패스'}</strong><small>${id==='health'?'오늘도 나를 돌봐요':'결제 정보는 저장되지 않아요'}</small></div></div><div class="settings-card"><div class="setting-row">${id==='health'?'활동 요약':'카드 추가'} <span class="tail">›</span></div><div class="setting-row">${id==='health'?'마음 챙기기':'교통 카드'} <span class="tail">›</span></div></div></div>`);return}
if(id==='podcasts')return;
appFrame('앱',`<div class="app-body"><p>이 앱은 iOS 스타일 UI를 보여 주기 위한 시뮬레이션입니다.</p></div>`)
}
function settingsApp(){appFrame('설정',`<div class="app-body"><div class="profile"><div class="avatar">🐱</div><div><strong>묭이 💗</strong><small>Apple 계정, iCloud, 미디어 및 구입 항목</small></div><span class="tail">›</span></div><div class="settings-card">${row('✈️','에어플레인 모드','airplane','#ff9f0a')+row('◉','Wi-Fi','wifi','#1684ff')+row('ᛒ','Bluetooth','bluetooth','#1684ff')+row('▮','셀룰러','cellular','#34c759')}</div><div class="section-title">설정</div><div class="settings-card">${row('🔔','알림','notifications','#ff453a')+row('🔊','사운드 및 햅틱','sounds','#ff2d55')+row('🌙','집중 모드','focus','#6750a4')+row('☀️','디스플레이 및 밝기','appearance','#68717d')}</div><div class="settings-card"><div class="setting-row" id="about"><span class="setting-icon gray">ⓘ</span>일반 <span class="tail">›</span></div><div class="setting-row" id="battery"><span class="setting-icon green">▰</span>배터리 <span class="tail">100% ›</span></div></div></div>`);main.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{let k=b.dataset.setting;settings[k]=!settings[k];b.classList.toggle('on',settings[k]);b.setAttribute('aria-pressed',settings[k]);notify(b.dataset.label+(settings[k]?' 켬':' 끔'))});$('#about').onclick=()=>notify('iOS 18 · iPhone UI 시뮬레이터');$('#battery').onclick=()=>notify('배터리 잔량 100%')}
function row(emoji,label,key,color){return `<div class="setting-row"><span class="setting-icon" style="background:${color}">${emoji}</span>${label}<button class="toggle ${settings[key]?'on':''}" data-setting="${key}" data-label="${label}" aria-label="${label} 토글" aria-pressed="${settings[key]}"></button></div>`}
function messagesApp(){appFrame('묭이 💗',`<div class="app-body" id="chatBody"><div style="text-align:center;color:#9299a5;font-size:12px;margin:5px 0 20px">iMessage · 오늘 오전 9:12</div><div class="message-thread" id="thread">${messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${escapeHtml(m.text)}</div>`).join('')}</div></div><form class="compose" id="compose"><input id="messageInput" placeholder="iMessage" autocomplete="off"><button class="send">↑</button></form>`);$('#compose').onsubmit=e=>{e.preventDefault();let input=$('#messageInput'),v=input.value.trim();if(!v)return;messages.push({text:v,mine:true});$('#thread').insertAdjacentHTML('beforeend',`<div class="bubble mine">${escapeHtml(v)}</div>`);input.value='';$('#chatBody').scrollTop=$('#chatBody').scrollHeight}}
function photosApp(){appFrame('최근 항목',`<div class="app-body"><div style="display:flex;justify-content:space-between;align-items:center"><h3>오늘</h3><span class="muted">선택</span></div><div class="photo-grid">${['🌅','🌸','🏙️','🏛️','🌷','🌊','🌄','🌳','🐈','🌆','☁️','🌼'].map((x,i)=>`<button class="photo" aria-label="사진 ${i+1}" data-photo="${x}">${x}</button>`).join('')}</div><p class="muted" style="margin-top:18px">사진을 누르면 미리보기가 표시됩니다.</p></div>`);main.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>notify('사진 미리보기 '+b.dataset.photo))}
function cameraApp(){appFrame('카메라',`<div class="camera"><div style="display:flex;justify-content:space-between"><button class="cam-small" onclick="notify('플래시 자동')">⚡</button><button class="cam-small" onclick="notify('라이브 포토 켬')">◉</button></div><div class="camera-preview" id="cameraPreview">🌇</div><div class="camera-controls"><button class="cam-small" onclick="openApp('photos')">🌄</button><button class="shutter" id="shutter" aria-label="사진 찍기"></button><button class="cam-small" id="flip">↻</button></div><div style="text-align:center;font-size:11px;letter-spacing:.1em">시네마틱　비디오　<span style="color:#ffd43b">사진</span>　인물 사진</div></div>`);$('#shutter').onclick=()=>{notify('찰칵! 사진이 촬영되었어요 📸');$('#cameraPreview').style.filter='brightness(1.7)';setTimeout(()=>$('#cameraPreview')&&($('#cameraPreview').style.filter=''),180)};$('#flip').onclick=()=>notify('카메라가 전환되었어요')}
function safariApp(){appFrame('Safari',`<div class="browserbar"><button id="refresh">↻</button><input id="urlInput" value="https://www.apple.com" aria-label="웹 주소"><button id="go">이동</button></div><div class="webpage" id="webpage"><div class="apple">●</div><h2>iPhone UI</h2><p>웹에서 만나는 iOS 18</p><button class="cta" id="startBtn">시작하기 →</button></div><div style="height:47px;display:flex;align-items:center;justify-content:space-around;background:#f8f8fb;color:#087cff;font-size:21px">‹　›　⇧　▣　▢</div>`);const go=()=>{let val=$('#urlInput').value.trim();if(!val)return;$('#webpage').innerHTML=`<div style="font-size:45px">🌐</div><h2>${escapeHtml(val.replace(/^https?:\/\//,''))}</h2><p>이 시뮬레이터에서는 외부 웹페이지를 실제로 불러오지 않아요.</p><button class="cta" id="homePage">시작 페이지</button>`;$('#homePage').onclick=()=>safariApp()};$('#go').onclick=go;$('#urlInput').onkeydown=e=>{if(e.key==='Enter')go()};$('#refresh').onclick=()=>notify('페이지를 새로 고쳤어요');$('#startBtn').onclick=()=>{notify('환영해요!');$('#urlInput').value='https://www.apple.com'}}
function showControl(){overlay.innerHTML=`<div class="control-center"><div style="display:flex;justify-content:space-between;align-items:center;font-weight:700"><span>제어 센터</span><button class="back" id="closeCC">×</button></div><div class="cc-top"><div class="cc-card"><div class="cc-connect">${[['✈️','airplane'],['◉','cellular'],['◉','wifi'],['ᛒ','bluetooth']].map(([e,k])=>`<button class="cc-btn ${settings[k]?'active':''}" data-cc="${k}" aria-label="${k}">${e}</button>`).join('')}</div></div><div class="cc-card cc-media"><strong>♫　지금 재생 중</strong><span>아직 재생 중인 음악이 없어요</span><div style="font-size:18px">◀　▶　▶</div></div></div><div class="cc-row"><button class="cc-tile" id="focusBtn">🌙　집중 모드 <span>${settings.focus?'켬':'끔'}</span></button><button class="cc-tile" id="screenBtn">▣　화면 미러링</button></div><div class="cc-row"><div class="slider-tile"><div class="slider-track"></div><span>☀️ 밝기</span><input id="brightness" type="range" min="30" max="100" value="${brightness}" style="width:85%"></div><div class="slider-tile"><div class="slider-track" style="background:linear-gradient(to top,#fff 0 ${volume}%,#d8dce2 ${volume}%);"></div><span>🔊 음량</span><input id="volume" type="range" min="0" max="100" value="${volume}" style="width:85%"></div></div><div class="cc-row"><button class="cc-tile" id="torchBtn">🔦　손전등</button><button class="cc-tile" id="calcBtn">🧮　계산기</button></div><div class="cc-row"><button class="cc-tile" id="cameraCC">📷　카메라</button><button class="cc-tile" id="recordBtn">⦿　화면 기록</button></div></div>`;$('#closeCC').onclick=()=>overlay.innerHTML='';overlay.querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>{let k=b.dataset.cc;settings[k]=!settings[k];b.classList.toggle('active',settings[k]);notify(k+' '+(settings[k]?'켬':'끔'))});$('#focusBtn').onclick=()=>{settings.focus=!settings.focus;showControl()};$('#screenBtn').onclick=()=>notify('주변 기기를 찾을 수 없어요');$('#brightness').oninput=e=>{brightness=+e.target.value;wallpaper.style.filter=`brightness(${brightness/100})`};$('#volume').oninput=e=>volume=+e.target.value;$('#torchBtn').onclick=()=>notify('손전등 '+(settings.torch?'끔':'켬'));$('#calcBtn').onclick=()=>calculator();$('#cameraCC').onclick=()=>{overlay.innerHTML='';openApp('camera')};$('#recordBtn').onclick=()=>notify('화면 기록을 시작했어요')}
function calculator(){appFrame('계산기',`<div class="app-body" style="background:#17181c;color:white;display:flex;flex-direction:column;justify-content:flex-end"><div id="calcDisplay" style="font-size:48px;text-align:right;padding:15px;min-height:90px">0</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','=',''].filter(Boolean).map(x=>`<button class="calc-key" data-key="${x}" style="border:0;border-radius:50%;aspect-ratio:1;background:${['÷','×','−','+','='].includes(x)?'#ff9f0a':['AC','±','%'].includes(x)?'#a5a5a5':'#34353a'};color:${['AC','±','%'].includes(x)?'#111':'white'};font-size:23px">${x}</button>`).join('')}</div></div>`);let expr='';main.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key;if(k==='AC')expr='';else if(k==='='){try{expr=String(Function('"use strict";return ('+expr.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-')+')')())}catch{expr='오류'}}else if(k==='±')expr=String(-Number(expr||0));else expr+=k;$('#calcDisplay').textContent=expr||'0'})}
function notify(msg){let old=$('.toast');if(old)old.remove();let t=document.createElement('div');t.className='toast';t.textContent=msg;$('#screen').append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2200)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateClock(){let d=new Date(),h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0'),time=`${h%12||12}:${m}`;$('#statusTime').textContent=time;let big=$('#bigTime');if(big)big.textContent=time;let live=$('#liveClock');if(live)live.textContent=time}
$('#screen').addEventListener('click',e=>{if(current==='lock'&& !e.target.closest('button')){locked=false;home()}});
let startY=null;$('#screen').addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});$('#screen').addEventListener('touchend',e=>{if(startY===null)return;let dy=e.changedTouches[0].clientY-startY;if(dy < -55 && !overlay.firstElementChild){if(current==='lock'){locked=false;home()}else if(current!=='home'){home()}else showControl()}else if(dy>65&&startY<80){showControl()}startY=null},{passive:true});
$('#screen').addEventListener('contextmenu',e=>e.preventDefault());
$('#homeIndicator').addEventListener('click',()=>{if(overlay.firstElementChild){overlay.innerHTML='';return}if(current!=='home'&&current!=='lock'){home()}else if(current==='home'){showControl()}else{locked=false;home()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){overlay.innerHTML='';home()}});
updateClock();setInterval(updateClock,15000);lock();
</script>
</body></html>
